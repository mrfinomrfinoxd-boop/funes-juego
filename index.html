<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funes: juego de exploración</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-screen">
    <img id="loading-image" src="images/carga_1.jpg" alt="Pantalla de carga" />
    <div class="loading-panel">
      <h1>Funes</h1>
      <p>Preparando el mapa…</p>
      <button id="start-button">Entrar al juego</button>
    </div>
  </div>

  <main class="app">
    <header class="topbar">
      <div>
        <h1>Funes: exploración</h1>
        <p>Explora el mapa y crea tus propios puntos de misión.</p>
      </div>
      <button id="locate-button" class="secondary-button">Mi ubicación</button>
    </header>

    <section class="game-layout">
      <div id="map" aria-label="Mapa interactivo de Funes"></div>

      <aside class="sidebar">
        <h2>Misiones</h2>
        <p class="hint">Haz clic en el mapa para añadir un punto de misión.</p>
        <p id="progress">Completadas: 0</p>
        <div id="mission-list"></div>
        <button id="clear-button" class="clear-button">Borrar misiones</button>
        <p class="credit">
          Mapa © OpenStreetMap contributors
        </p>
      </aside>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
